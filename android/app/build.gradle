plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (set by the GitHub Actions workflow
// from repository secrets). Without them the build still runs, but the bundle is unsigned.
def ksFile = System.getenv("ANDROID_KEYSTORE_FILE")
def hasSigning = ksFile != null && new File(ksFile).exists()

android {
    namespace 'com.namaz100.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.namaz100.app'
        minSdk 24
        targetSdk 36
        versionCode((System.getenv("VERSION_CODE") ?: "3") as Integer)
        versionName System.getenv("VERSION_NAME") ?: "1.2"
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(ksFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    // Reuse the same sources as the Gradle-free build (android/build.sh).
    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['../src', '../src-play']
            res.srcDirs = ['../res']
            assets.srcDirs = ['../gen-assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:8.0.0'
}
